onboarding = false

[keys]
# ctrl+b (the default) shadows vim's page-up
prefix = "ctrl+space"

# jump back to the previously focused pane, like tmux
last_pane = "prefix+;"

move_tab_previous = "prefix+shift+p"   # optional, e.g. "alt+shift+left" moves the tab toward the front
move_tab_next = "prefix+shift+n"       # optional, e.g. "alt+shift+right" moves the tab toward the back

