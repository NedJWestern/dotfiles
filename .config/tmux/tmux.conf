# Pass through DECSCUSR cursor-shape/blink escape codes to the outer
# terminal, so a blinking cursor set by Neovim's guicursor/t_SI/t_SR/t_EI
# is visible instead of tmux swallowing it.
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# Use ctrl+space as the prefix; ctrl+b (the default) shadows vim's page-up.
# Pressing it twice sends a literal ctrl+space to the inner program.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
